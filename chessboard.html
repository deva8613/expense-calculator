

<!DOCTYPE html>
<html>
<head>
    <title>Chessboard</title>

    <style>
        .chessboard {
            width: 480px;
            height: 480px;
            border: 5px solid black;
        }

        .row {
            display: flex;
        }

        .black,
        .white {
            width: 60px;
            height: 60px;
        }

        .black {
            align-items: center;
            display: flex;
            justify-content: center;
            background-color: rgb(245, 246, 245);
        }

        .white {
            align-items: center;
            display: flex;
            justify-content: center;
            background-color: rgb(250, 208, 56);
        }
    </style>
</head>

<body>

    <div class="chessboard">

        <div class="row">
            <div class="black">X</div>
            <div class="white">O</div>
            <div class="black">X</div>
            <div class="white">O</div>
            <div class="black">X</div>
            <div class="white">O</div>
            <div class="black">X</div>
            <div class="white">O</div>
        </div>

        <div class="row">
            <div class="white"></div>
            <div class="black"></div>
            <div class="white"></div>
            <div class="black"></div>
            <div class="white"></div>
            <div class="black"></div>
            <div class="white"></div>
            <div class="black"></div>
        </div>

        <div class="row">
            <div class="black"></div>
            <div class="white"></div>
            <div class="black"></div>
            <div class="white"></div>
            <div class="black"></div>
            <div class="white"></div>
            <div class="black"></div>
            <div class="white"></div>
        </div>

        <div class="row">
            <div class="white"></div>
            <div class="black"></div>
            <div class="white"></div>
            <div class="black"></div>
            <div class="white"></div>
            <div class="black"></div>
            <div class="white"></div>
            <div class="black"></div>
        </div>

        <div class="row">
            <div class="black"></div>
            <div class="white"></div>
            <div class="black"></div>
            <div class="white"></div>
            <div class="black"></div>
            <div class="white"></div>
            <div class="black"></div>
            <div class="white"></div>
        </div>

        <div class="row">
            <div class="white"></div>
            <div class="black"></div>
            <div class="white"></div>
            <div class="black"></div>
            <div class="white"></div>
            <div class="black"></div>
            <div class="white"></div>
            <div class="black"></div>
        </div>

        <div class="row">
            <div class="black"></div>
            <div class="white"></div>
            <div class="black"></div>
            <div class="white"></div>
            <div class="black"></div>
            <div class="white"></div>
            <div class="black"></div>
            <div class="white"></div>
        </div>

        <div class="row">
            <div class="white">X</div>
            <div class="black">O</div>
            <div class="white">X</div>
            <div class="black">O</div>
            <div class="white">X</div>
            <div class="black">O</div>
            <div class="white">X</div>
            <div class="black">O</div>
        </div>

    </div>

</body>
</html>
