<!DOCTYPE html>
<html>
    <head>
        <title>Registeration Details</title>
        <style>
            form{
                box-sizing: border-box;
                border: 2px solid black;
                align-items: center;
                text-align: center;
                font-family: 'Times New Roman', Times, serif;
            }
        </style>
    </head>
    <body>
        <form>
            <label>Enter  your Name:</label>
            <input type="text" placeholder="enter your name"><br>
            <label>Enter your Mail: </label>
            <input type="text" placeholder="enter your email id"><br>
            <label>Enter your PhoneNo:</label>
            <input type="number" placeholder="enter your mobile number" required maxlength="10"><br>
            <label>Enter your Address:</label><br>
            <textarea rows="10" cols="50"></textarea><br>
            <button type="submit" value="Register"></button>
            <p>Already registered? <a href="login.html">Login here</a></p>
        </form>
    </body>
</html>
